name: Core and MCP checks
on: [push, pull_request]
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF parser for Linux integration checks
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci
      - run: npm run setup
      - name: Install pinned OCR languages for real scan tests
        shell: bash
        run: |
          .venv-sss/$([[ "$RUNNER_OS" == "Windows" ]] && echo Scripts || echo bin)/python scripts/install-pdf-ocr.py --root "$RUNNER_TEMP/geneloop-pdf-ocr"
          echo "GENELOOP_PDF_OCR_ROOT=$RUNNER_TEMP/geneloop-pdf-ocr" >> "$GITHUB_ENV"
      - run: npm test
      - name: Annotate test failures
        if: failure()
        run: python scripts/annotate-ci-failures.py .local/ci/python-results.xml .local/ci/node-results.xml
      - run: npm run smoke
      - run: npm run motif:check
