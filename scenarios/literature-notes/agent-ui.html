<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>文献工作台</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#24332f;background:#f4f6f2;font-size:15px}*{box-sizing:border-box}body{margin:0}header{padding:28px 36px;background:#173e35;color:#fff}header h1{margin:0 0 8px;font-size:27px}header p{margin:0;color:#c3d8ce}main{display:grid;grid-template-columns:340px minmax(0,1fr);gap:22px;padding:24px;max-width:1600px;margin:auto}section,.panel{background:white;border:1px solid #dae2d8;border-radius:12px;padding:22px}h2{font-size:19px;margin:0 0 18px}label{display:block;margin:14px 0 7px}input[type=text],input[type=number],textarea{width:100%;padding:10px;border:1px solid #b9c7be;border-radius:6px;font:inherit}textarea{resize:vertical;line-height:1.6}button,.download{border:0;border-radius:6px;padding:11px 15px;background:#245c48;color:white;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}button.secondary{background:#e6ede5;color:#284634}button:disabled{opacity:.45;cursor:default}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.hint{color:#66756b;font-size:13px;line-height:1.7}.check{display:flex;gap:8px;align-items:flex-start;line-height:1.6}.check input{margin-top:5px}.error{color:#a13228;background:#fff0ed;padding:12px;border-radius:6px;white-space:pre-wrap}.job{display:block;width:100%;text-align:left;color:#263e30;background:#f1f5ef;margin:8px 0;padding:12px}.job.active{outline:2px solid #2c6a50}.status{padding:12px;background:#edf4ed;border-radius:7px;line-height:1.7}.metrics{display:flex;gap:22px;flex-wrap:wrap;margin:18px 0}.metric strong{display:block;font-size:24px}.metric span{font-size:12px;color:#69796e}.card{border-top:1px solid #dae2d8;padding:20px 0}.card h3{font-size:16px;margin:0 0 8px}.quote{background:#f7f8f3;border-left:3px solid #b6cba7;padding:12px;white-space:pre-wrap;line-height:1.7;overflow-wrap:anywhere}.locator{color:#57695d;font-size:12px}.model{color:#6b6e52;margin:10px 0;font-size:13px}.paper-heading{font-size:18px;margin:28px 0 10px;overflow-wrap:anywhere}#content{min-width:0}#empty{padding:60px 20px;color:#63766a;text-align:center}#message:empty{display:none}details{margin:14px 0}summary{cursor:pointer}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border:1px solid #dce5d9;text-align:left;vertical-align:top;padding:10px;line-height:1.7}th{background:#eef4eb}.table-wrap{overflow:auto}#overview td:first-child{min-width:140px}#overview td{min-width:180px}@media(max-width:900px){main{grid-template-columns:1fr;padding:12px}header{padding:22px}#overview td{min-width:160px}}
</style>
<header><h1>文献工作台</h1><p>普通 PDF → 自动阅读与核验 → 补证据与修复 → 直接交付结果 → 变化后更新</p></header>
<main><aside><section><h2>整理一组论文</h2><form id="form">
<label for="directory">PDF 文件夹</label><input id="directory" type="text" value="testpdf" required>
<p class="hint">读取指定文件夹第一层的 PDF。原文件保持不变；单次最多20篇。</p>
<label for="question">研究问题</label><textarea id="question" rows="5" required>这三篇论文的方法、实验证据和限制，对构建高效科研 Agent 有什么启示？</textarea>
<label for="budget">本次总预算上限（美元）</label><input id="budget" type="number" min="0.01" max="100" step="0.01" value="100">
<label class="check"><input id="paid" type="checkbox"><span>启用模型、自动审阅及逐论断修复，会产生 API 费用。未勾选时仅检查配置。</span></label>
<div class="buttons"><button id="run" type="submit">开始整理</button></div>
<p class="hint">费用按本机预算代理估算，需与账单核对。自动审阅后直接交付，无需人工批准。</p>
</form><div id="message" class="error"></div></section>
<section style="margin-top:18px"><h2>任务记录</h2><div id="jobs"></div></section></aside>
<section id="content"><div id="empty">先检查配置或整理当前三篇论文。<br><br>结果在这里直接显示，可展开证据来源并下载笔记。</div></section></main>
<script>
const token='__SESSION_TOKEN__'; let selected=null,cards=null,live=false;
const $=id=>document.getElementById(id);
const labels={research_goal:'研究目标',method:'方法',evaluation:'实验与评价',findings:'报告结果',limitations:'限制'};
const statuses={preparing:'检查来源',reading:'阅读与整理',updating:'更新变化内容',reviewing:'自动审阅',repairing:'逐论断补证据与修复',delivered:'结果已交付',delivered_with_gaps:'结果已交付（有证据缺口）',needs_review:'旧版结果',approved:'用户已核对来源',cached:'复用已有结果',superseded:'历史稿（已有修订）',preview:'配置检查完成',error:'任务未完成'};
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;}
async function api(path,body){const r=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-Agent-Session':token},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error||'请求失败');return data;}
function message(err){$('message').textContent=String(err||'');}
async function list(){const jobs=await api('/api/jobs');$('jobs').replaceChildren();for(const j of jobs){const b=node('button',(statuses[j.status]||j.status)+' · '+new Date(j.created_at).toLocaleString(),'job'+(j.id===selected?' active':''));b.onclick=()=>show(j.id);$('jobs').append(b);}return jobs;}
function metrics(job){const box=node('div',undefined,'metrics');for(const [value,label] of [[job.model_requests,'本次模型请求'],[job.cost_complete?'$'+job.accounted_usd.toFixed(5):'未完整记账','本次代理估费'],[job.verified_skips,'Motif 验证跳过']]){const n=node('div',undefined,'metric');n.append(node('strong',String(value)),node('span',label));box.append(n);}if(job.incremental)box.append(node('p','复用 '+job.incremental.retained+' 项，重新处理 '+job.incremental.regenerated+' 项。历史费用保留在原任务。','hint'));return box;}
async function show(id){selected=id;await list();const job=await api('/api/jobs/'+id);live=['preparing','reading','updating','reviewing','repairing'].includes(job.status);const content=$('content');content.replaceChildren(node('h2','任务结果'));const status=node('div',statuses[job.status]||job.status,'status');status.append(node('div',live?'智能体正在处理，完成后自动显示结果。':job.status==='preview'?'当前只检查配置，启用模型后可生成结果。':job.status==='error'?'任务未完成；下面保留的是中间产物。':'智能体直接交付，无需人工批准。来源和缺口可展开查看；自动审阅可能遗漏错误。','hint'));content.append(status,metrics(job));content.append(node('p',job.options.question));if(job.repair_warning)content.append(node('div',job.repair_warning,'error'));if(job.error)content.append(node('div',job.error,'error'));
if(job.incremental)content.append(node('p','本次保留 '+job.incremental.retained+' 个字段，重新处理 '+job.incremental.regenerated+' 个字段。','hint'));
if(job.repair_rounds?.length){for(const r of job.repair_rounds)if(r.status==='failed')content.append(node('p','自动修复第 '+r.round+' 轮未完成；费用已计入。','hint'));else {if(r.receipt_origin==='validated_model_final_json_recovery')content.append(node('p','模型结构化提案由程序校验回收；没有伪造原生提交或新增模型请求。','hint'));content.append(node('p','自动修复第 '+r.round+' 轮：复核 '+r.target_count+' 项，修改 '+r.changed_claim_count+' 项，撤回 '+r.withdrawn_claim_count+' 项，未解决 '+r.unresolved_claim_ids.length+' 项。','hint'));}}
if(job.repair_stop_reason==='round_limit_reached')content.append(node('p','已达到修复轮次上限；尚未解决的项已标为缺口，直接交付当前结果。','hint'));
if(job.repair_stop_reason==='remaining_budget_insufficient')content.append(node('p','剩余预算不足以继续修复；当前结果保留，未完成额外复核。','hint'));
if(job.inherited_model_requests)content.append(node('p','本次回收0次新模型请求；此前提案 '+job.inherited_model_requests+' 次请求、估费 $'+job.inherited_expense_usd.toFixed(6)+'，费用保留在原任务。','hint'));
if(job.resume_scope)content.append(node('p','本次针对已有稿进行新的自动语义复核与修复；先前阅读费用保留在原任务。','hint'));
if(job.cached_from)content.append(node('p','来源与任务一致，经过原文重放后复用结果。本次未调用模型。','hint'));
if(job.redelivery_scope)content.append(node('p','这是旧结果经来源核验后的重新交付，保留此前的模型与抽查修订记录，本次没有重新做语义审阅。','hint'));
const actions=node('div',undefined,'buttons');if(['delivered','delivered_with_gaps','needs_review','approved','cached','error'].includes(job.status)){const update=node('button','检查来源并更新','secondary');update.onclick=()=>launch({...job.options,parent_job:job.id,call_model:$('paid').checked,repair_only:false,force_refresh:false});actions.append(update);if(job.status!=='error'){const repair=node('button','自动补证据与修复','secondary');repair.onclick=()=>launch({...job.options,parent_job:job.id,call_model:$('paid').checked,repair_only:true,repair_rounds:1,model_review:true,force_refresh:false});actions.append(repair);}const again=node('button','重新生成','secondary');again.onclick=()=>launch({...job.options,parent_job:undefined,call_model:$('paid').checked,repair_only:false,force_refresh:true});actions.append(again);}content.append(actions);
try{cards=await api('/api/jobs/'+id+'/cards');}catch{return;}if(cards.codex_spot_check)content.append(node('p','Codex 对部分来源错配做了抽查修订；原模型稿已保留；这不是全稿质量认证。','hint'));const download=node('a','下载阅读笔记','download');download.href='/api/jobs/'+id+'/notes';actions.append(download);
const overview=node('details');overview.open=true;overview.append(node('summary','论文比较表'));const wrap=node('div',undefined,'table-wrap');const table=node('table');table.id='overview';const heading=node('tr');for(const label of ['论文',...Object.values(labels)])heading.append(node('th',label));table.append(heading);for(const filename of [...new Set(cards.rows.map(r=>r.filename))]){const tr=node('tr');tr.append(node('td',filename));for(const name of Object.keys(labels)){const r=cards.rows.find(r=>r.filename===filename&&r.name===name);const pages=[...new Set(r.quotes.map(q=>q.page))];tr.append(node('td',r.statement+(pages.length?' [PDF p. '+pages.join(', ')+']':' [来源缺口]')));}table.append(tr);}wrap.append(table);overview.append(wrap);content.append(overview);
content.append(node('h3','综合分析 / 研究假设'));const synthesis=node('div',cards.synthesis,'quote');synthesis.style.whiteSpace='pre-wrap';content.append(synthesis);
if(cards.gaps.length){const gaps=node('div',undefined,'error');gaps.append(node('strong','本次未完成的证据项'));for(const gap of cards.gaps){const row=cards.rows.find(r=>r.paper_id===gap.paper_id&&r.name===gap.field);gaps.append(node('p',row?row.filename+' · '+labels[row.name]+'：本次提取或引用校验未完成，未作为已证实内容交付。':String(gap)));}content.append(gaps);}
const sources=node('details');sources.append(node('summary','查看论断依据与自动审阅记录'));let filename='';for(const row of cards.rows){if(row.filename!==filename){filename=row.filename;sources.append(node('h3',filename,'paper-heading'));}const card=node('div',undefined,'card');card.append(node('h3',labels[row.name]),node('p',row.statement));if(row.status!=='evidence')card.append(node('div','该字段有缺口：'+row.status,'error'));if(row.missing_literal_numbers.length)card.append(node('div','陈述中的数值未在所选引文中找到：'+row.missing_literal_numbers.join(', '),'error'));if(row.model_review)card.append(node('div','模型审阅：'+row.model_review.verdict+'；'+row.model_review.reason,'model'));for(const quote of row.quotes){card.append(node('p','PDF 物理页 '+quote.page+' · 字符 '+quote.quote_start+'–'+quote.quote_end,'locator'),node('div',quote.quote,'quote'));}sources.append(card);}content.append(sources);}

async function launch(options){try{message('');$('run').disabled=true;const result=await api('/api/run',options);await show(result.job_id);}catch(e){message(e.message);}finally{$('run').disabled=false;}}
$('form').onsubmit=e=>{e.preventDefault();launch({papers_dir:$('directory').value,question:$('question').value,budget_usd:Number($('budget').value),call_model:$('paid').checked,model_review:true});};
list().catch(e=>message(e.message));setInterval(async()=>{if(live&&selected){try{await show(selected);}catch(e){message(e.message);}}},2500);
</script>
</html>
