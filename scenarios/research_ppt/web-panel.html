<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>科研 PPT</title>
<style>body{font:16px system-ui;max-width:900px;margin:32px auto;padding:0 20px;color:#243047}label{display:block;margin-top:20px}textarea{width:100%;height:100px}button,input,select{font:inherit;padding:8px;margin:8px 8px 8px 0}button{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f5f8;padding:18px}a{margin-right:12px}#error{color:#b22}.group{padding:18px;margin-top:18px;border:1px solid #ccd3dd}</style>
<h1>科研 PPT</h1><p>预览确认后串行生成普通 DSH 和优化 Agent 两份结果。<a href="/">返回 Harness</a></p>
<label>PDF / PPTX（1–8份，每份100 MiB，总计256 MiB）</label><input id="files" type="file" accept=".pdf,.pptx" multiple>
<label>你的要求</label><textarea id="instruction" placeholder="介绍方法、关键实验和局限，采用自然的组会风格。"></textarea>
<label>页数（留空默认15页）</label><input id="slides" type="number" min="1" max="30" placeholder="15"><select id="operation"><option value="generate">生成新 PPT</option><option value="restyle">已有 PPT 重排</option></select><select id="template"><option value="lab">科研组会</option><option value="academic">学术汇报</option></select>
<p>双路预算上限 $3，每路 $1.50；60 步、8000 输出 token。关闭思考和压缩，不自动生成新工具。</p>
<button id="preview">上传并预览</button><button id="submit" disabled>确认并执行</button><button id="cancel" disabled>取消</button><p id="error"></p><pre id="status">请先选择文件</pre><div id="results"></div>
<script>
const $=id=>document.getElementById(id);let task=null,busy=false;
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(body){const r=await fetch('/api/harless/ppt'+(body?'':'?task_id='+encodeURIComponent(task.task_id)),{credentials:'same-origin',cache:'no-store',...(body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{})});const v=await r.json();if(!r.ok||v.error)throw Error(v.error||'请求失败');return v;}
function show(t){task=t;sessionStorage.setItem('ppt-task',t.task_id);$('status').textContent=`状态：${t.status}\n页数：${t.slides}\n双路预算：$${t.budget_usd_total}\n${t.impact}\n${t.failure||''}`;$('submit').disabled=t.status!=='awaiting_confirmation';$('cancel').disabled=!['running','awaiting_confirmation'].includes(t.status);$('results').innerHTML=['baseline','optimized'].map(g=>{const r=t.results[g];if(!r)return '';return `<div class="group"><h2>${g==='baseline'?'普通 DSH':'优化 Agent'}</h2><p>渲染交付：${r.mechanical_delivery_verified?'通过':'未通过'} · 科研内容待评审</p><pre>${esc(JSON.stringify(r.accounting,null,2))}</pre>${t.artifacts.filter(a=>a.group===g).map(a=>`<a href="${esc(a.download_url)}">下载 ${esc(a.kind)} ${esc(a.name)}</a>`).join('')}</div>`;}).join('');}
async function act(fn){if(busy)return;busy=true;$('error').textContent='';try{await fn();}catch(e){$('error').textContent=e.message;}finally{busy=false;}}
$('preview').onclick=()=>act(async()=>{task=null;$('submit').disabled=true;const files=[...$('files').files];if(!files.length||files.length>8||files.some(f=>f.size>100*1024*1024)||files.reduce((n,f)=>n+f.size,0)>256*1024*1024)throw Error('请选择1–8份文件，并遵守大小限制');const ids=[];for(const f of files){$('status').textContent='上传 '+f.name;const r=await fetch('/api/harless/ppt/upload?name='+encodeURIComponent(f.name),{method:'POST',body:f,credentials:'same-origin'});const v=await r.json();if(!r.ok||v.error)throw Error(v.error||'上传失败');ids.push(v.id);}const b={action:'preview',receipt_ids:ids,template:$('template').value,operation:$('operation').value};if($('instruction').value.trim())b.instruction=$('instruction').value;if($('slides').value)b.slides=Number($('slides').value);$('status').textContent='准备预览，不调用模型…';show(await api(b));});
$('submit').onclick=()=>act(async()=>show(await api({action:'submit',task_id:task.task_id,confirmation_digest:task.confirmation_digest})));
$('cancel').onclick=()=>act(async()=>show(await api({action:'cancel',task_id:task.task_id})));
for(const id of ['files','instruction','slides','template','operation'])$(id).onchange=()=>{if(task?.status==='awaiting_confirmation'){$('submit').disabled=true;$('status').textContent='参数已变，请重新预览。';task=null;}};
setInterval(()=>{if(task?.status==='running'&&!busy)act(async()=>show(await api()));},3000);
const saved=sessionStorage.getItem('ppt-task');if(saved){task={task_id:saved};act(async()=>show(await api()));}
</script></html>
