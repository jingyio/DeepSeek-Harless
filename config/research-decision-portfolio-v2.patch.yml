- insert:
    - id: sss-research-decision-portfolio
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: research_portfolio_fixture
        transport: stdio
        command: !!js process.env.SSS_MCP_PYTHON
        args: ['benchmarks/research_decision_portfolio_v2/mock_apps_server.py']
        cwd: !!js process.env.SSS_PROJECT_ROOT
        env:
          PYTHONPATH: !!js process.env.SSS_PROJECT_ROOT
          SSS_PORTFOLIO_CASE: !!js process.env.SSS_PORTFOLIO_CASE
        failOnStartupError: true
