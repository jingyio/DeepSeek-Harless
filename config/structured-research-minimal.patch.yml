# Focused, read-only data phase: only structured MCP tools are shown
# to the model. This is a separate experimental condition from ordinary DSH.
- id: persistent-bash
  disabled: true

- id: persistent-pwsh
  disabled: true

- id: sessions
  config:
    root: !!js dshHomePath('sessions-minimal')
    compression: none

- insert:
    - id: credentials
      name: '@deepseek-ai/dsh-credentials-local'
    - id: sss-structured-research-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: structured_research
        transport: stdio
        command: !!js process.env.SSS_MCP_PYTHON
        args: ['-m', 'src.mcp.structured_research_server']
        cwd: !!js process.env.SSS_PROJECT_ROOT
        env:
          SSS_RESEARCH_INPUT_DIR: !!js process.env.SSS_RESEARCH_INPUT_DIR
        failOnStartupError: true
