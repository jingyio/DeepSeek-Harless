# Tool-centred AIDD SAR-Diff development trial. The base scoped patch keeps
# Zotero/Obsidian limited to the approved roles and disables native shell/file tools.
- insert:
    - id: sss-local-research-tools-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: local_research_tools
        transport: stdio
        command: !!js process.env.SSS_MCP_PYTHON
        args: ['-m', 'src.mcp.local_research_tools_server']
        cwd: !!js process.env.SSS_PROJECT_ROOT
        env:
          SSS_RESEARCH_INPUT_DIR: !!js process.env.SSS_RESEARCH_INPUT_DIR
          SSS_PYTHON_WORKSPACE: !!js process.env.SSS_PYTHON_WORKSPACE
        failOnStartupError: true
