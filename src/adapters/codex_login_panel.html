<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harless Codex 登录</title><style>body{font:16px/1.6 system-ui,sans-serif;max-width:680px;margin:36px auto;padding:0 20px;color:#172b2b}button{padding:9px 16px;margin:8px 8px 8px 0}code{font-size:1.3em}#notice{white-space:pre-wrap}a{color:#075fbb}</style>
<h1>Codex 登录</h1><p>仅限当前单人私有 Harness 运行。使用你自己的 ChatGPT 账号完成设备码授权；账号凭据由 DSH 保存在服务器私有凭据存储。</p>
<p id="status">读取状态中…</p><p id="notice"></p><p id="verification"></p>
<button id="login">使用 ChatGPT 登录</button><button id="cancel" hidden>取消登录</button><button id="logout" hidden>移除本机登录</button>
<p><a href="/">返回 Harness</a></p>
<script>
const api='/api/harless/codex-login';
const status=document.querySelector('#status'),notice=document.querySelector('#notice'),verification=document.querySelector('#verification');
const login=document.querySelector('#login'),cancel=document.querySelector('#cancel'),logout=document.querySelector('#logout');
async function update(){try{const r=await fetch(api,{cache:'no-store'});if(!r.ok)throw Error('无法读取登录状态');const s=await r.json();
 status.textContent=s.signed_in?'已登录 ChatGPT（Codex）':s.status==='failed'?'登录失败，请重试':s.in_flight?'等待授权…':'尚未登录';
 notice.textContent=s.notice?.message||'';verification.replaceChildren();
 if(s.notice?.url){const a=document.createElement('a');a.href=s.notice.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='打开 OpenAI 授权页面';verification.append(a)}
 if(s.notice?.code){const p=document.createElement('p');p.append('设备码：');const c=document.createElement('code');c.textContent=s.notice.code;p.append(c);verification.append(p)}
 login.hidden=s.signed_in||s.in_flight||!s.available;cancel.hidden=!s.in_flight;logout.hidden=!s.signed_in||s.in_flight;
 }catch(e){status.textContent=e.message}}
async function action(name){const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:name})});if(!r.ok){status.textContent='操作失败（'+r.status+'）';return}await update()}
login.onclick=()=>action('login');cancel.onclick=()=>action('cancel');logout.onclick=()=>action('logout');update();setInterval(update,2500);
</script></html>
